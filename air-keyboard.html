<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Keyboard - Gesture Typing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    header {
      padding: 12px 24px;
      text-align: center;
      width: 100%;
      background: linear-gradient(180deg, #1a1a2e 0%, transparent 100%);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 0.75rem;
      color: #888;
      margin-top: 2px;
    }

    #main-container {
      position: relative;
      width: 840px;
      max-width: 95vw;
      aspect-ratio: 4/3;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
      background: #000;
    }

    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    #keyboard-overlay {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
      pointer-events: none;
    }

    .key-row {
      display: flex;
      gap: 5px;
    }

    .key {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 600;
      color: #e0e0e0;
      background: rgba(30, 30, 50, 0.75);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      transition: transform 0.1s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
      user-select: none;
    }

    .key.hovered {
      background: rgba(255, 214, 0, 0.25);
      border-color: rgba(255, 214, 0, 0.6);
      box-shadow: 0 0 12px rgba(255, 214, 0, 0.3);
      transform: scale(1.08);
    }

    .key.pressed {
      background: rgba(255, 214, 0, 0.6);
      border-color: #ffd600;
      box-shadow: 0 0 20px rgba(255, 214, 0, 0.5);
      transform: scale(0.92);
    }

    .key.wide {
      width: 90px;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    .key.space {
      width: 260px;
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #aaa;
    }

    #text-display {
      margin-top: 16px;
      width: 840px;
      max-width: 95vw;
      min-height: 56px;
      padding: 14px 20px;
      background: rgba(20, 20, 35, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      font-size: 1.1rem;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      color: #f0f0f0;
      letter-spacing: 0.5px;
      word-wrap: break-word;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    #text-display .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: #667eea;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    #status {
      margin-top: 10px;
      font-size: 0.75rem;
      color: #666;
    }

    #status.active {
      color: #4caf50;
    }

    .loading-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      z-index: 100;
      gap: 16px;
    }

    .loading-screen .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(102, 126, 234, 0.2);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-screen p {
      color: #888;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Air Keyboard</h1>
    <p>Pinch your index finger and thumb to type</p>
  </header>

  <div id="main-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="overlay-canvas"></canvas>
    <div id="keyboard-overlay"></div>
    <div class="loading-screen" id="loading">
      <div class="spinner"></div>
      <p>Initializing camera &amp; hand tracking...</p>
    </div>
  </div>

  <div id="text-display"><span id="typed-text"></span><span class="cursor"></span></div>
  <div id="status">Waiting for hand detection...</div>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs';

    // --- Keyboard Layout ---
    const ROWS = [
      ['Q','W','E','R','T','Y','U','I','O','P'],
      ['A','S','D','F','G','H','J','K','L'],
      ['Z','X','C','V','B','N','M','BACK'],
      ['SPACE']
    ];

    // --- DOM Setup ---
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    const keyboardOverlay = document.getElementById('keyboard-overlay');
    const typedText = document.getElementById('typed-text');
    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading');

    let typedString = '';
    let lastPressTime = 0;
    let isPinching = false;
    let hoveredKey = null;
    const PINCH_THRESHOLD = 0.05;
    const PRESS_COOLDOWN = 350;

    // --- Build Keyboard DOM ---
    const keyElements = {};

    ROWS.forEach(row => {
      const rowEl = document.createElement('div');
      rowEl.className = 'key-row';
      row.forEach(key => {
        const keyEl = document.createElement('div');
        keyEl.className = 'key';
        keyEl.dataset.key = key;
        if (key === 'BACK') {
          keyEl.classList.add('wide');
          keyEl.textContent = '\u232B';
        } else if (key === 'SPACE') {
          keyEl.classList.add('space');
          keyEl.textContent = 'SPACE';
        } else {
          keyEl.textContent = key;
        }
        keyElements[key] = keyEl;
        rowEl.appendChild(keyEl);
      });
      keyboardOverlay.appendChild(rowEl);
    });

    // --- Video geometry helpers ---
    function getVideoDisplayRect() {
      const container = document.getElementById('main-container');
      const containerRect = container.getBoundingClientRect();
      const videoAspect = video.videoWidth / video.videoHeight;
      const containerAspect = containerRect.width / containerRect.height;

      let displayWidth, displayHeight, offsetX, offsetY;
      if (videoAspect > containerAspect) {
        displayWidth = containerRect.width;
        displayHeight = containerRect.width / videoAspect;
        offsetX = 0;
        offsetY = (containerRect.height - displayHeight) / 2;
      } else {
        displayHeight = containerRect.height;
        displayWidth = containerRect.height * videoAspect;
        offsetX = (containerRect.width - displayWidth) / 2;
        offsetY = 0;
      }
      return { displayWidth, displayHeight, offsetX, offsetY, containerRect };
    }

    // --- Webcam Init ---
    async function startWebcam() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: 'user' }
      });
      video.srcObject = stream;
      await new Promise(resolve => { video.onloadedmetadata = resolve; });
      video.play();
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    // --- MediaPipe Init ---
    let handLandmarker;

    async function initHandTracking() {
      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm'
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numHands: 1
      });
    }

    // --- Hand Drawing ---
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [0,9],[9,10],[10,11],[11,12],
      [0,13],[13,14],[14,15],[15,16],
      [0,17],[17,18],[18,19],[19,20],
      [5,9],[9,13],[13,17]
    ];

    function drawHand(landmarks) {
      const w = canvas.width;
      const h = canvas.height;

      // Draw connections
      ctx.strokeStyle = 'rgba(102, 126, 234, 0.7)';
      ctx.lineWidth = 2.5;
      HAND_CONNECTIONS.forEach(([a, b]) => {
        const pA = landmarks[a];
        const pB = landmarks[b];
        ctx.beginPath();
        ctx.moveTo((1 - pA.x) * w, pA.y * h);
        ctx.lineTo((1 - pB.x) * w, pB.y * h);
        ctx.stroke();
      });

      // Draw landmarks
      landmarks.forEach((pt, i) => {
        const x = (1 - pt.x) * w;
        const y = pt.y * h;
        ctx.beginPath();
        ctx.arc(x, y, i === 8 || i === 4 ? 7 : 4, 0, Math.PI * 2);
        ctx.fillStyle = i === 8 ? '#ffd600' : i === 4 ? '#ff5722' : '#667eea';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
      });
    }

    // --- Key Hit Detection ---
    function getKeyAtPosition(x, y) {
      const container = document.getElementById('main-container');
      const rect = container.getBoundingClientRect();
      const { displayWidth, displayHeight, offsetX, offsetY } = getVideoDisplayRect();

      // Convert normalized coords to container-relative pixels (mirrored)
      // Account for object-fit: contain letterboxing
      const px = offsetX + (1 - x) * displayWidth;
      const py = offsetY + y * displayHeight;

      for (const [key, el] of Object.entries(keyElements)) {
        const keyRect = el.getBoundingClientRect();
        const kx = keyRect.left - rect.left;
        const ky = keyRect.top - rect.top;
        const kw = keyRect.width;
        const kh = keyRect.height;

        if (px >= kx && px <= kx + kw && py >= ky && py <= ky + kh) {
          return key;
        }
      }
      return null;
    }

    // --- Pinch Detection ---
    function getPinchDistance(landmarks) {
      const thumb = landmarks[4];
      const index = landmarks[8];
      const dx = thumb.x - index.x;
      const dy = thumb.y - index.y;
      const dz = (thumb.z || 0) - (index.z || 0);
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    // --- Key Press Handling ---
    function pressKey(key) {
      if (key === 'BACK') {
        typedString = typedString.slice(0, -1);
      } else if (key === 'SPACE') {
        typedString += ' ';
      } else {
        typedString += key.toLowerCase();
      }
      typedText.textContent = typedString;

      // Press animation
      const el = keyElements[key];
      el.classList.add('pressed');
      setTimeout(() => el.classList.remove('pressed'), 200);
    }

    // --- Detection Loop ---
    let lastTimestamp = -1;

    function detect() {
      if (video.readyState < 2) {
        requestAnimationFrame(detect);
        return;
      }

      const now = performance.now();
      if (now === lastTimestamp) {
        requestAnimationFrame(detect);
        return;
      }
      lastTimestamp = now;

      const results = handLandmarker.detectForVideo(video, now);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Clear previous hover
      if (hoveredKey && keyElements[hoveredKey]) {
        keyElements[hoveredKey].classList.remove('hovered');
      }
      hoveredKey = null;

      if (results.landmarks && results.landmarks.length > 0) {
        const landmarks = results.landmarks[0];
        statusEl.textContent = 'Hand detected - hover over keys to type';
        statusEl.className = 'active';

        drawHand(landmarks);

        // Index finger tip position
        const indexTip = landmarks[8];
        const currentKey = getKeyAtPosition(indexTip.x, indexTip.y);

        if (currentKey) {
          hoveredKey = currentKey;
          keyElements[currentKey].classList.add('hovered');
        }

        // Pinch detection
        const pinchDist = getPinchDistance(landmarks);
        const currentlyPinching = pinchDist < PINCH_THRESHOLD;

        if (currentlyPinching && !isPinching && currentKey) {
          const elapsed = now - lastPressTime;
          if (elapsed > PRESS_COOLDOWN) {
            pressKey(currentKey);
            lastPressTime = now;
          }
        }
        isPinching = currentlyPinching;

        // Draw pinch indicator
        const thumbTip = landmarks[4];
        const tx = (1 - thumbTip.x) * canvas.width;
        const ty = thumbTip.y * canvas.height;
        const ix = (1 - indexTip.x) * canvas.width;
        const iy = indexTip.y * canvas.height;

        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(ix, iy);
        ctx.strokeStyle = isPinching ? 'rgba(255, 214, 0, 0.9)' : 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = isPinching ? 3 : 1.5;
        ctx.stroke();

        if (isPinching) {
          const midX = (tx + ix) / 2;
          const midY = (ty + iy) / 2;
          ctx.beginPath();
          ctx.arc(midX, midY, 10, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 214, 0, 0.4)';
          ctx.fill();
        }
      } else {
        statusEl.textContent = 'No hand detected - show your hand to the camera';
        statusEl.className = '';
        isPinching = false;
      }

      requestAnimationFrame(detect);
    }

    // --- Start ---
    async function main() {
      try {
        await startWebcam();
        await initHandTracking();
        loadingEl.style.display = 'none';
        detect();
      } catch (err) {
        loadingEl.innerHTML = `<p style="color:#ef5350;">Error: ${err.message}</p><p style="color:#888;font-size:0.8rem;margin-top:8px;">Please allow camera access and use a modern browser.</p>`;
        console.error(err);
      }
    }

    main();
  </script>
</body>
</html>
